name: Daily Tennis Digest

on:
  schedule:
    # Once daily at 8:30am PT, summarizing the previous day's finished
    # matches (get_fixtures returns real completed-match results by date,
    # so there's no need to poll multiple times a day to catch a fleeting
    # "Finished" status - see README).
    # NOTE: GitHub Actions cron is fixed UTC and doesn't observe DST, so
    # this drifts to ~7:30am PT once PDT ends (early November) until
    # updated to "30 16 * * *" for PST.
    - cron: "30 15 * * *"  # 8:30am PDT (UTC-7)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py
